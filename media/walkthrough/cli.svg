<svg viewBox="0 0 400 190" xmlns="http://www.w3.org/2000/svg" fill="none">
  <!-- The architecture in one picture: the editor asks, the CLI answers with
       versioned JSON, and the silicon facts live in one curated database.
       Drawn with currentColor so it reads in every VS Code theme. -->
  <g stroke="currentColor" stroke-width="1.4" opacity="0.9">
    <rect x="14" y="58" width="104" height="62" rx="6"/>
    <rect x="158" y="58" width="88" height="62" rx="6"/>
    <rect x="286" y="58" width="100" height="62" rx="6"/>
  </g>

  <g fill="currentColor" font-family="var(--vscode-font-family)" font-size="12">
    <text x="66" y="83" text-anchor="middle" opacity="0.95">this</text>
    <text x="66" y="99" text-anchor="middle" opacity="0.95">extension</text>
    <text x="202" y="92" text-anchor="middle" opacity="0.95">alloy CLI</text>
    <text x="336" y="83" text-anchor="middle" opacity="0.95">curated</text>
    <text x="336" y="99" text-anchor="middle" opacity="0.95">silicon data</text>
  </g>

  <!-- Arrows, labelled with what actually crosses each boundary. -->
  <g stroke="currentColor" stroke-width="1.4" opacity="0.75">
    <path d="M118 89h32" stroke-linecap="round"/>
    <path d="M144 84l6 5-6 5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M246 89h32" stroke-linecap="round"/>
    <path d="M272 84l6 5-6 5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g fill="currentColor" font-family="var(--vscode-editor-font-family)" font-size="9.5" opacity="0.7">
    <text x="134" y="79" text-anchor="middle">--json</text>
    <text x="262" y="79" text-anchor="middle">yaml</text>
  </g>

  <text x="200" y="152" text-anchor="middle" fill="currentColor" opacity="0.72"
        font-family="var(--vscode-font-family)" font-size="11.5">
    The extension holds no knowledge of silicon.
  </text>
  <text x="200" y="169" text-anchor="middle" fill="currentColor" opacity="0.55"
        font-family="var(--vscode-font-family)" font-size="11.5">
    Every number you see came from the CLI.
  </text>
</svg>
