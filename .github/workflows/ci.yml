name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Typecheck + the headless VS Code integration tests (the "CLI is the brain"
  # contract, driven end-to-end against a stubbed alloy CLI). A real display isn't
  # available on CI, so the extension host runs under xvfb.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: install deps
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: integration tests (headless VS Code)
        run: xvfb-run -a npm test
