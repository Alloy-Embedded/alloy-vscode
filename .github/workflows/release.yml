# Publish the extension to the VS Code Marketplace (and Open VSX) on a tag.
#
# Trigger: push a tag like v0.2.0. Mirrors how alloy and alloy-devices release,
# so the three repos work the same way.
#
# Secrets this needs, set in repo Settings → Secrets → Actions:
#   VSCE_PAT  — Azure DevOps personal access token with Marketplace → Manage,
#               for the `alloy-embedded` publisher. Required.
#   OVSX_PAT  — open-vsx.org token. Optional; the Open VSX step is skipped
#               when it is absent, so a release does not go red for a registry
#               you have not signed up to.
name: release

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # attach the .vsix to the GitHub release
    env:
      # Job level, not step level: a step's own `env` is not reliably in scope
      # for that step's `if`, and the Open VSX step is conditional on this.
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: install deps
        run: npm ci

      - name: sanity — version matches tag
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "${GITHUB_REF_NAME}" ] || {
            echo "package.json $v != tag ${GITHUB_REF_NAME}"; exit 1; }

      # The failure this repo actually hit: the extension demanded a CLI that
      # only existed in a checkout, so anyone who installed it got "unsupported
      # envelope" on the first call. An extension is never publishable before
      # the CLI it requires is.
      - name: sanity — the CLI this extension requires is published
        run: |
          min=$(grep -oE 'MIN_CLI_VERSION = "[0-9]+\.[0-9]+\.[0-9]+"' src/cli.ts \
                | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          [ -n "$min" ] || { echo "could not read MIN_CLI_VERSION from src/cli.ts"; exit 1; }
          curl -sfL https://pypi.org/pypi/alloy-embedded/json -o /tmp/pypi.json
          node -e '
            const want = process.argv[1];
            const have = Object.keys(require("/tmp/pypi.json").releases).sort();
            if (!have.includes(want)) {
              console.error(`alloy-embedded ${want} is not on PyPI (have: ${have.join(", ")}).`);
              console.error("Release the CLI before the extension that requires it.");
              process.exit(1);
            }
            console.log(`ok — this extension requires alloy-embedded ${want}, which is published`);
          ' "$min"

      # Two release cycles were burned on a rename that reached package-lock.json
      # and not package.json: `vsce publish` is the FIRST thing that reads the
      # name, so the mismatch surfaced only after tests, packaging, and a tag.
      - name: sanity — the extension id is what we think it is
        run: |
          node -e '
            const pkg = require("./package.json");
            const lock = require("./package-lock.json");
            const id = `${pkg.publisher}.${pkg.name}`;
            if (lock.name !== pkg.name) {
              console.error(`package-lock name ${lock.name} != package.json ${pkg.name}`);
              process.exit(1);
            }
            if (!pkg.publisher || !pkg.name) {
              console.error("publisher and name are both required to publish");
              process.exit(1);
            }
            console.log(`publishing as ${id}`);
          '

      - name: typecheck
        run: npm run typecheck

      - name: tests (headless VS Code needs a display)
        run: xvfb-run -a npm test

      - name: package
        run: npx vsce package --no-dependencies

      - name: publish to the VS Code Marketplace
        run: npx vsce publish --packagePath *.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      # Open VSX is where VSCodium, Gitpod and Cursor users install from.
      # Skipped rather than failed when the token is not configured.
      - name: publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx ovsx publish *.vsix --pat "$OVSX_PAT"

      - name: attach the .vsix to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.vsix"
          generate_release_notes: true
